name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Generate project files
        run: |
          mkdir -p oqp
          cat > oqp/settings.gradle.kts <<'QPEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OneQuickPanel"
          include(":app")
          QPEOF
          mkdir -p oqp
          cat > oqp/build.gradle.kts <<'QPEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          QPEOF
          mkdir -p oqp
          cat > oqp/gradle.properties <<'QPEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          QPEOF
          mkdir -p oqp/app
          cat > oqp/app/build.gradle.kts <<'QPEOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "dev.oneqp"
              compileSdk = 34
              defaultConfig { applicationId = "dev.oneqp"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "0.1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          QPEOF
          mkdir -p oqp/app/src/main
          cat > oqp/app/src/main/AndroidManifest.xml <<'QPEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/>
              <application android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".PanelService" android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
                  <service android:name=".NotifService" android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
              </application>
          </manifest>
          QPEOF
          mkdir -p oqp/app/src/main/res/xml
          cat > oqp/app/src/main/res/xml/accessibility_config.xml <<'QPEOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:description="@string/svc_desc" />
          QPEOF
          mkdir -p oqp/app/src/main/res/values
          cat > oqp/app/src/main/res/values/strings.xml <<'QPEOF'
          <resources>
              <string name="app_name">One Quick Panel</string>
              <string name="svc_desc">Rysuje panel szybkich ustawień po przeciągnięciu z góry ekranu.</string>
          </resources>
          QPEOF
          mkdir -p oqp/app/src/main/java/dev/oneqp
          cat > oqp/app/src/main/java/dev/oneqp/NotifService.kt <<'QPEOF'
          package dev.oneqp

          import android.service.notification.NotificationListenerService

          class NotifService : NotificationListenerService() {
              companion object { var instance: NotifService? = null }
              override fun onListenerConnected() { instance = this }
              override fun onListenerDisconnected() { instance = null }
          }
          QPEOF
          mkdir -p oqp/app/src/main/java/dev/oneqp
          cat > oqp/app/src/main/java/dev/oneqp/MainActivity.kt <<'QPEOF'
          package dev.oneqp

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  l.addView(TextView(this).apply { text = "One Quick Panel — włącz po kolei:"; textSize = 18f })
                  fun btn(t: String, i: Intent) = l.addView(Button(this).apply { text = t; setOnClickListener { startActivity(i) } })
                  btn("1. Usługa dostępności (One Quick Panel)", Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  btn("2. Dostęp do powiadomień", Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  btn("3. Zmiana ustawień systemu", Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName")))
                  btn("4. Nie przeszkadzać", Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS))
                  setContentView(ScrollView(this).apply { addView(l) })
              }
          }
          QPEOF
          mkdir -p oqp/app/src/main/java/dev/oneqp
          cat > oqp/app/src/main/java/dev/oneqp/PanelService.kt <<'QPEOF'
          package dev.oneqp

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class PanelService : AccessibilityService() {
              private lateinit var wm: WindowManager
              private var strip: View? = null
              private var panel: View? = null
              private var torchOn = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onServiceConnected() {
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  addStrip()
              }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() {
                  if (::wm.isInitialized) { strip?.let { try { wm.removeView(it) } catch (_: Exception) {} }; hidePanel() }
                  super.onDestroy()
              }

              private fun overlay(w: Int, h: Int) = WindowManager.LayoutParams(
                  w, h, WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                  PixelFormat.TRANSLUCENT
              ).apply { gravity = Gravity.TOP }

              // Cienki, niewidoczny pasek na górze ekranu: przeciągnięcie w dół otwiera panel.
              private fun addStrip() {
                  val v = View(this)
                  var startY = 0f
                  v.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> startY = ev.rawY
                          MotionEvent.ACTION_MOVE -> if (panel == null && ev.rawY - startY > dp(40)) showPanel()
                      }
                      true
                  }
                  wm.addView(v, overlay(WindowManager.LayoutParams.MATCH_PARENT, dp(32)))
                  strip = v
              }

              private fun hidePanel() {
                  panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  panel = null
              }

              private fun go(i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try { startActivity(i) } catch (_: Exception) {}
                  hidePanel()
              }

              private fun tile(label: String, onTap: (TextView) -> Unit) = TextView(this).apply {
                  text = label; setTextColor(Color.WHITE); gravity = Gravity.CENTER; textSize = 13f
                  background = GradientDrawable().apply { cornerRadius = dp(24).toFloat(); setColor(Color.parseColor("#3C4043")) }
                  layoutParams = LinearLayout.LayoutParams(0, dp(64), 1f).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }
                  setOnClickListener { onTap(this) }
              }

              private fun setOn(v: TextView, on: Boolean) {
                  (v.background as GradientDrawable).setColor(Color.parseColor(if (on) "#3E82F7" else "#3C4043"))
              }

              private fun torch(v: TextView) {
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val id = cm.cameraIdList.first { cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true }
                      torchOn = !torchOn
                      cm.setTorchMode(id, torchOn)
                      setOn(v, torchOn)
                  } catch (_: Exception) { torchOn = false }
              }

              private fun dnd(v: TextView) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (!nm.isNotificationPolicyAccessGranted) { go(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)); return }
                  val turnOn = nm.currentInterruptionFilter == NotificationManager.INTERRUPTION_FILTER_ALL
                  nm.setInterruptionFilter(if (turnOn) NotificationManager.INTERRUPTION_FILTER_PRIORITY else NotificationManager.INTERRUPTION_FILTER_ALL)
                  setOn(v, turnOn)
              }

              private fun rotate(v: TextView) {
                  if (!Settings.System.canWrite(this)) { go(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName"))); return }
                  val cur = Settings.System.getInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, 0)
                  Settings.System.putInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, 1 - cur)
                  setOn(v, cur == 0)
              }

              private fun slider(max: Int, cur: Int, onChange: (Int) -> Unit) = SeekBar(this).apply {
                  this.max = max; progress = cur
                  setPadding(dp(8), dp(12), dp(8), dp(12))
                  setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) { if (fromUser) onChange(p) }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
              }

              private fun showPanel() {
                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.argb(140, 0, 0, 0))
                  root.setOnClickListener { hidePanel() }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(48), dp(16), dp(12))
                      isClickable = true
                      val r = dp(28).toFloat()
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F2202124"))
                          cornerRadii = floatArrayOf(0f, 0f, 0f, 0f, r, r, r, r)
                      }
                  }
                  card.addView(TextView(this).apply {
                      text = SimpleDateFormat("HH:mm  EEE, d MMM", Locale.getDefault()).format(Date())
                      setTextColor(Color.WHITE); textSize = 22f; setPadding(dp(8), 0, 0, dp(12))
                  })

                  val row1 = LinearLayout(this); val row2 = LinearLayout(this)
                  row1.addView(tile("Wi‑Fi") { go(Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY)) })
                  row1.addView(tile("Bluetooth") { go(Intent(Settings.ACTION_BLUETOOTH_SETTINGS)) })
                  row1.addView(tile("Tryb samolotowy") { go(Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS)) })
                  row2.addView(tile("Latarka") { torch(it) })
                  row2.addView(tile("Nie przeszkadzać") { dnd(it) })
                  row2.addView(tile("Autoobrót") { rotate(it) })
                  card.addView(row1); card.addView(row2)

                  val br = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128)
                  card.addView(slider(255, br) {
                      if (Settings.System.canWrite(this)) {
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, it)
                      }
                  })
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  card.addView(slider(am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), am.getStreamVolume(AudioManager.STREAM_MUSIC)) {
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, it, 0)
                  })

                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  NotifService.instance?.activeNotifications?.filter { it.notification.flags and Notification.FLAG_GROUP_SUMMARY == 0 }?.forEach { sbn ->
                      val ex = sbn.notification.extras
                      list.addView(TextView(this).apply {
                          text = "${ex.getCharSequence(Notification.EXTRA_TITLE) ?: ""}\n${ex.getCharSequence(Notification.EXTRA_TEXT) ?: ""}"
                          setTextColor(Color.WHITE); maxLines = 3; setPadding(dp(14), dp(10), dp(14), dp(10))
                          background = GradientDrawable().apply { cornerRadius = dp(20).toFloat(); setColor(Color.parseColor("#303134")) }
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, dp(4), 0, dp(4)) }
                          setOnClickListener { try { sbn.notification.contentIntent?.send() } catch (_: Exception) {}; hidePanel() }
                      })
                  }
                  card.addView(ScrollView(this).apply { addView(list) }, LinearLayout.LayoutParams(-1, dp(260)))
                  card.addView(TextView(this).apply {
                      text = "Wyczyść wszystko   ▲"; setTextColor(Color.parseColor("#8AB4F8")); gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, dp(4))
                      setOnClickListener { NotifService.instance?.cancelAllNotifications(); hidePanel() }
                  })
                  card.addView(TextView(this).apply {
                      text = "▲ zamknij"; setTextColor(Color.LTGRAY); gravity = Gravity.CENTER; setPadding(0, dp(8), 0, dp(4))
                      setOnClickListener { hidePanel() }
                  })

                  root.addView(card, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))
                  wm.addView(root, overlay(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT))
                  panel = root
              }
          }
          QPEOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build APK
        working-directory: oqp
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: OneQuickPanel-debug, path: oqp/app/build/outputs/apk/debug/app-debug.apk }
